<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="sticky.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header class="app-header">
            <h1><i class="fas fa-book"></i>Sticky</h1>
            <button id="add-note-btn" class="btn btn-primary">
                <i class="fas fa-plus"></i> 
            </button>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search notes...">
                <button id="clear-search" class="btn btn-icon">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div class="notes-grid" id="notes-container">
          
        </div>

        <div id="empty-state" class="empty-state">
            <p>No notes yet. Add your first note!</p>
        </div>
    </div>

    <div class="modal" id="note-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Note</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="note-title">Title</label>
                    <input type="text" id="note-title" placeholder="Note title">
                </div>
                <div class="form-group">
                    <label for="note-content">Content</label>
                    <textarea id="note-content" placeholder="Write your note here..." rows="8"></textarea>
                </div>
                <div class="color-picker">
                    <label>Color:</label>
                    <div class="color-options">
                        <input type="radio" id="color-default" name="note-color" value="#fff385" checked>
                        <label for="color-default" class="color-option" style="background-color: #fff385;"></label>
                        
                        <input type="radio" id="color-blue" name="note-color" value="#69f5fa">
                        <label for="color-blue" class="color-option" style="background-color: #69f5fa;"></label>
                        
                        <input type="radio" id="color-green" name="note-color" value="#6fff6f">
                        <label for="color-green" class="color-option" style="background-color: #6fff6f;"></label>
                        
                        <input type="radio" id="color-pink" name="note-color" value="#ffd6ff">
                        <label for="color-pink" class="color-option" style="background-color: #ffd6ff;"></label>
                        
                        <input type="radio" id="color-teal" name="note-color" value="#81b69f">
                        <label for="color-teal" class="color-option" style="background-color: #81b69f;"></label>

                        <input type="radio" id="color-brown" name="note-color" value="#ffa483">
                        <label for="color-brown" class="color-option" style="background-color: #ffa483;"></label>

                        <input type="radio" id="color-light-green" name="note-color" value="#90ee90">
                        <label for="color-light-green" class="color-option" style="background-color: #90ee90;"></label>

                        <input type="radio" id="color-purple" name="note-color" value="#9099ee">
                        <label for="color-purple" class="color-option" style="background-color: #9099ee;"></label>

                        <input type="radio" id="color-bl" name="note-color" value="#9fc5ff">
                        <label for="color-bl" class="color-option" style="background-color: #9fc5ff;"></label>

                        <input type="radio" id="color-avo" name="note-color" value="#6cc3a9">
                        <label for="color-avo" class="color-option" style="background-color: #6cc3a9;"></label>

                        <input type="radio" id="color-red" name="note-color" value="#ff7272">
                        <label for="color-red" class="color-option" style="background-color: #ff7272;"></label>

                        <input type="radio" id="color-ed" name="note-color" value="#a6ff9f">
                        <label for="color-ed" class="color-option" style="background-color: #a6ff9f;"></label>

                        <input type="radio" id="color-d" name="note-color" value="#ffa79f">
                        <label for="color-d" class="color-option" style="background-color: #ffa79f;"></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-modal">Cancel</button>
                <button class="btn btn-primary" id="save-note">Save Note</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
