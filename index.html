<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="sticky.jpg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <header class="app-header">
        <h1><i class="fas fa-book"></i>Sticky</h1>
        <button id="add-note-btn" class="btn btn-primary">
          <i class="fas fa-plus"></i>
        </button>
      </header>

      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="search-input" placeholder="Search notes..." />
          <button id="clear-search" class="btn btn-icon">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <div class="notes-grid" id="notes-container"></div>

      <div id="empty-state" class="empty-state">
        <p>No notes yet. Add your first note!</p>
      </div>
    </div>

    <div class="modal" id="note-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Add New Note</h2>
          <button class="close-btn" id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="note-title">Title</label>
            <input type="text" id="note-title" placeholder="Note title" />
          </div>
          <div class="form-group">
            <label for="note-content">Content</label>
            <textarea
              id="note-content"
              placeholder="Write your note here..."
              rows="8"
            ></textarea>
          </div>

          <div class="color-picker">
            <div class="color-picker-group">
              <label for="background_color"> Background Color: </label>
              <div class="color-picker-control">
                <input
                  id="background_color"
                  type="color"
                  name="background-color"
                  value="#fff385"
                />
                <span id="background_color_name"> #fff385 </span>
              </div>
            </div>

            <div class="color-picker-group">
              <label for="text_color"> Text Color: </label>
              <div class="color-picker-control">
                <input
                  id="text_color"
                  type="color"
                  name="text-color"
                  value="#000000"
                />
                <span id="text_color_name"> #000000 </span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancel-modal">Cancel</button>
          <button class="btn btn-primary" id="save-note">Save Note</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
